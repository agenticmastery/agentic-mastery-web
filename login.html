<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self';">
    <title>Recruiter Sign In | AgenticMastery.ai</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="portal.css">
</head>
<body>
    <div class="google-bar" aria-hidden="true">
        <span class="b"></span><span class="r"></span><span class="y"></span><span class="g"></span>
    </div>

    <header class="portal-header">
        <div class="container header-inner">
            <a href="index.html" class="brand">
                <img src="assets/logo.jpg" alt="AgenticMastery" class="brand-img">
                <span class="brand-title">Agentic<strong>Mastery</strong>.ai</span>
            </a>
            <a href="index.html" class="btn btn-outline btn-sm">&larr; Back to Home</a>
        </div>
    </header>

    <main class="login-shell">
        <div class="login-card">
            <span class="workspace-pill">Recruiter &amp; Partner Portal</span>
            <h1 style="margin-top: 0.85rem;">Access Pre-Checked Talent</h1>
            <p>Curated by engineering leaders from Tier-1 Product Companies &amp; Enterprise GCCs.</p>

            <a href="portal.html" class="btn btn-primary" style="width: 100%;">
                Enter Interactive Demo Workspace &rarr;
            </a>

            <form action="portal.html" method="get" class="login-form">
                <input type="email" name="email" required placeholder="Work Email (e.g., recruiter@company.com)">
                <input type="password" name="code" placeholder="Partner Access Code (Optional for Demo)">
                <button type="submit" class="btn btn-secondary" style="width: 100%;">Sign In with Partner Email</button>
            </form>
        </div>
    </main>
</body>
</html>
